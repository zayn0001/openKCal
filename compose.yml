services:
  thally:
    build: .
    ports: ["3000:3000"]
    volumes: ["./data-server:/data"]
    # Settings come from .env (see .env.example and the README); all are optional.
    environment:
      ORIGIN: ${ORIGIN:-}
      SIGNUP: ${SIGNUP:-invite}
      ALLOW_GUEST: ${ALLOW_GUEST:-1}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOW_LAN: ${ALLOW_LAN:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-40}
      AUDIT_LOG: ${AUDIT_LOG:-1}
      AUDIT_IP: ${AUDIT_IP:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      MIRROR_ENDPOINT: ${MIRROR_ENDPOINT:-}
      MIRROR_BUCKET: ${MIRROR_BUCKET:-}
      MIRROR_REGION: ${MIRROR_REGION:-}
      MIRROR_PREFIX: ${MIRROR_PREFIX:-}
      MIRROR_KEY_ID: ${MIRROR_KEY_ID:-}
      MIRROR_SECRET: ${MIRROR_SECRET:-}
    restart: unless-stopped
