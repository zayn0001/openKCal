name: Build and Release Android APK

# Every push to main builds a signed openKCal APK and publishes it as the latest GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older, still-running build pointless
concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build, sign & release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 compiles with Java 21

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # An unsigned APK cannot be installed, so there is nothing worth releasing without these
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret for $name (see README: Android APK). No release made."
              exit 1
            fi
          done

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # Always higher than the last build, so the new APK installs over the old one
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          # The same keystore.properties a local build uses; build.gradle signs with it
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}

      - name: Package
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk openkcal.apk
          sha256sum openkcal.apk > openkcal.apk.sha256
          node -e "
            const fs = require('fs'), apk = fs.readFileSync('openkcal.apk')
            const info = { version: '${{ steps.v.outputs.name }}', build: ${{ github.run_number }}, size: apk.length,
              sha256: require('crypto').createHash('sha256').update(apk).digest('hex'), built: new Date().toISOString().slice(0, 10) }
            fs.writeFileSync('openkcal.json', JSON.stringify(info, null, 2) + '\n'); console.log(info)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: openKCal ${{ steps.v.outputs.name }} (build ${{ github.run_number }})
          files: |
            openkcal.apk
            openkcal.apk.sha256
            openkcal.json
          make_latest: true
          generate_release_notes: true

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties
