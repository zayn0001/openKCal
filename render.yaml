# Thally on Render's free tier: one service running the Dockerfile, with its data kept in an
# S3-compatible bucket (server/mirror.js), since a free service's disk is wiped on every restart.
# Same arrangement as the openGym fork, but with a bucket of its own: the mirror copies the whole
# bucket into the data folder, so the two apps must not share one.
services:
  - type: web
    name: thally
    runtime: docker
    plan: free
    region: singapore # next to the Supabase project (ap-southeast-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # The port Render routes to.
      - key: PORT
        value: "10000"
      # Render sits in front as a proxy: rate-limit sign-in by the visitor's address, not Render's.
      - key: TRUST_PROXY
        value: "1"
      # The service's own address (e.g. https://thally-abcd.onrender.com). Leave it empty on the
      # first deploy, then set it: it turns passkeys on and marks cookies Secure.
      - key: ORIGIN
        sync: false
      # After the first account (the owner), new accounts need an invite code from an admin.
      - key: SIGNUP
        value: invite
      # Only signed-in people use this server's app.
      - key: ALLOW_GUEST
        value: "0"
      # Storage in the same Supabase project and private `default` bucket as openGym, in a folder of
      # its own (MIRROR_PREFIX): both apps keep a `secret` and an `audit.log` at the top of their data
      # folder, so without the folder they would overwrite each other's. The keys: Storage > S3
      # connection > New access key. They reach every bucket in the project, so they are entered
      # in Render and never committed.
      - key: MIRROR_ENDPOINT
        value: https://ismyhkcsxrswqsfzfrxe.storage.supabase.co/storage/v1/s3
      - key: MIRROR_BUCKET
        value: default
      - key: MIRROR_PREFIX
        value: thally/
      - key: MIRROR_REGION
        value: ap-southeast-1
      - key: MIRROR_KEY_ID
        sync: false
      - key: MIRROR_SECRET
        sync: false
